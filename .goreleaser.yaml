version: 2
builds:
  - id: inhoused
    main: ./cmd/inhoused
    binary: inhoused
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/quinnovator/inhouse/internal/version.Version={{.Version}}"]
    goos: [linux]
    goarch: [amd64, arm64]
  - id: inhouse
    main: ./cmd/inhouse
    binary: inhouse
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/quinnovator/inhouse/internal/version.Version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  # The CLI, for laptops and agents.
  - id: inhouse
    ids: [inhouse]
    formats: [tar.gz]
    name_template: 'inhouse_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE]
  # The daemon, with what install.sh expects next to it on the host.
  - id: inhoused
    ids: [inhoused]
    formats: [tar.gz]
    name_template: 'inhoused_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - src: deploy/host/inhoused.service
        strip_parent: true
      - src: deploy/host/install.sh
        strip_parent: true
checksum:
  name_template: checksums.sha512
  algorithm: sha512
release:
  draft: true
changelog:
  use: git
